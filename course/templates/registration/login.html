{% extends 'base.html' %}

{% block title %}Tizimga kirish{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-4">

        <div class="card text-white shadow-lg" style="background-color: #1e293b; border: 1px solid #334155; border-radius: 12px;">
            <div class="card-body p-4 p-md-5">
                <h3 class="card-title text-center mb-4">Tizimga kirish</h3>

                <form method="post">
                    {% csrf_token %}

                    <div class="mb-4" style="color: #cbd5e1;">
                        {{ form.as_p }}
                    </div>

                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-primary" style="background-color: #3b82f6; border: none;">
                            Kirish
                        </button>
                    </div>
                </form>

            </div>
        </div>

    </div>
</div>
{% endblock %}
