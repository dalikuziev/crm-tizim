{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Sayt nomi{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body class="d-flex flex-column align-items-center pt-3" style="background-color: #0f172a !important; color: #ffffff !important; min-height: 100vh;">

    <div class="container d-flex justify-content-end mb-2">
        {% if user.is_authenticated %}
            <span class="me-3 align-self-center">Xush kelibsiz <b>{{ user.username }}</b></span>
            <form action="{% url 'logout' %}" method="post" class="d-inline">
                {% csrf_token %}
                <button type="submit" class="btn btn-outline-danger btn-sm">Chiqish</button>
            </form>
        {% else %}
            <a href="{% url 'login' %}" class="btn btn-outline-info btn-sm">Kirish</a>
        {% endif %}
    </div>

    <div class="container pt-3">
        <div class="text-center mb-5">
            <a href="{% url 'home' %}">
                <img src="{% static 'logo.png' %}" alt="Logo" style="max-height: 70px;">
            </a>
        </div>

        {% block content %}
        {% endblock %}

    </div>
</body>
</html>
