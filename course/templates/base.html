<!DOCTYPE html>
<html lang="en">
<head>

    <title>{% block title %}{% endblock %}</title>

</head>
<body class="d-flex align-items-center bg-light" style="min-height: 100vh;">
    <div class="container">
        <form action="{% url 'home' %}" class="mb-4">

</html>
