{% extends 'base.html' %}
{% block title %}SubjectTeacher{% endblock %}
{% block content %}

<div class="mx-auto mt-4" style="max-width: 500px;">
    <h3 class="mb-4 text-center">Fan Ustozi: {{ subject.teacher }}</h3>
    <ol class="list-group list-group-numbered shadow-sm">
        {% for i in subject.teacher.student.all %}
            <li class="list-group-item">
                {{ i }}
            </li>
        {% endfor %}
    </ol>
</div>

{% endblock %}
