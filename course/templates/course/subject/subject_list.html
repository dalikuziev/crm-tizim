{% extends 'base.html' %}
{% block title %}SubjectList{% endblock %}
{% block content %}

<div class="mx-auto mt-4" style="max-width: 600px;">
    <h3 class="text-center mb-4 text-white">Fanlar ro'yxati</h3>
    <div class="list-group mb-4 shadow-sm">
        {% for subject in subjects %}
            <a href="{% url 'subject_teacher' subject.pk %}" class="list-group-item list-group-item-action">
                {{ subject }}
            </a>
        {% endfor %}
    </div>
    <div class="text-center">
        <a href="{% url 'teacher_create' %}" class="btn btn-primary px-4">Fan qo'shish</a>
    </div>
</div>

{% endblock %}
