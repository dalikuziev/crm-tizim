{% extends 'base.html' %}
{% block title %}SubjectDetail{% endblock %}
{% block content %}

<h1>
    Fan: {{ subject.title }}
</h1>
<h2>
    Natija: {{ subject.description }}
</h2>

<form action="{% url 'subject_update' subject.pk %}">
    <button>
        Update
    </button>
</form>
<form action="{% url 'subject_delete' subject.pk %}">
    <button>
        Delete
    </button>
</form>

{% endblock %}
